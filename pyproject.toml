[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunting-job-system"
version = "0.1.0"
description = "Autonomous remote career execution and tracking engine (zero-cost, precision-strike)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nafiz Mahfuz" }]

# Core dependencies — all free / open-source. No paid APIs.
dependencies = [
    # Ingestion
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Vector store
    "chromadb>=0.4",
    # PDF generation
    "reportlab>=4.0",
    # Dashboard
    "streamlit>=1.34",
    # Database
    # sqlite3 is part of the Python standard library — no install needed.
    # LLM / embeddings (free tiers)
    "openai>=1.30",   # Gemini embeddings via OpenAI-compatible endpoint / free tier
    "anthropic>=0.30",# Grok free tier (xAI) — adjust client as needed
    # Security (local encryption + backups)
    "cryptography>=42.0",
    # Scheduling
    "apscheduler>=3.10",
    # Graph (advanced layer)
    "networkx>=3.2",
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
