# ============================================================
# Target companies — the curated precision-strike list.
# 250+ remote-first companies across every ATS platform.
#
# The system scrapes in tiers:
#   Tier 1  Greenhouse JSON API  (platform: greenhouse)  — most reliable
#   Tier 2  Lever public JSON    (platform: lever)        — /jobs.json
#   Tier 3  Ashby JSON           (platform: ashby)        — /api/v1/jobs
#   Tier 4  Workable JSON        (platform: workable)     — /jobs.json
#   Tier 5  Direct careers HTML  (platform: direct)       — generic scrape
#   Tier 6  Manual paste         (platform: manual)       — you paste a JD
#
# Each company:
#   name:        display name
#   domain:      known corporate domain (fraud check baseline)
#   platform:    greenhouse | lever | ashby | workable | direct | manual
#   url:         careers page URL (used by fallback tiers + human)
#   board:       Greenhouse board slug (only for platform: greenhouse)
#   role_keywords: role titles to watch for
#   min_salary:  optional override (USD annual); falls back to settings.yaml
#
# Add/remove companies here. No code changes needed.
# ============================================================

